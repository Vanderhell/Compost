name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest
      - name: Run complete test suite
        run: python -m pytest -q

  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build-type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
          fi
      - name: Configure native core
        run: cmake -S native -B native/build-ci -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCOMPOST_BUILD_TESTS=ON -DCOMPOST_WARNINGS_AS_ERRORS=ON
      - name: Build native core
        run: cmake --build native/build-ci --parallel
      - name: Run native tests
        run: ctest --test-dir native/build-ci --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python differential harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Run Python/native pure-rule differential tests
        env:
          COMPOST_NATIVE_LIBRARY: ${{ github.workspace }}/native/build-ci/libcompost_native.so
        run: python -m pytest -q tests/test_native_differential.py
      - name: Run complete Python suite with native backend enabled
        env:
          COMPOST_NATIVE_LIBRARY: ${{ github.workspace }}/native/build-ci/libcompost_native.so
        run: python -m pytest -q
      - name: Run native workload benchmark matrix
        run: python tools/benchmark_native_workloads.py --library ${{ github.workspace }}/native/build-ci/libcompost_native.so --steps 256 --repetitions 3

  native-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GCC sanitizers
        run: |
          CC=gcc cmake -S native -B native/build-sanitizers \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCOMPOST_BUILD_TESTS=ON \
            -DCOMPOST_WARNINGS_AS_ERRORS=ON \
            -DCOMPOST_ENABLE_SANITIZERS=ON
      - name: Build sanitizer target
        run: cmake --build native/build-sanitizers --parallel
      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir native/build-sanitizers --output-on-failure

  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC native core
        run: cmake -S native -B native/build-msvc -DCOMPOST_BUILD_TESTS=ON -DCOMPOST_WARNINGS_AS_ERRORS=ON
      - name: Build MSVC native core
        run: cmake --build native/build-msvc --config Release --parallel
      - name: Run MSVC native tests
        run: ctest --test-dir native/build-msvc -C Release --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Windows differential harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Run Windows Python/native differential tests
        env:
          COMPOST_NATIVE_LIBRARY: ${{ github.workspace }}/native/build-msvc/Release/compost_native.dll
        run: python -m pytest -q tests/test_native_differential.py
      - name: Run complete Windows Python suite with native backend enabled
        env:
          COMPOST_NATIVE_LIBRARY: ${{ github.workspace }}/native/build-msvc/Release/compost_native.dll
        run: python -m pytest -q
      - name: Run Windows native workload benchmark matrix
        run: python tools/benchmark_native_workloads.py --library ${{ github.workspace }}/native/build-msvc/Release/compost_native.dll --steps 256 --repetitions 3
