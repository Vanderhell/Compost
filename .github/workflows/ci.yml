name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest
      - name: Run complete test suite
        run: python -m pytest -q

  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
          fi
      - name: Configure native core
        run: cmake -S native -B native/build-ci -DCMAKE_BUILD_TYPE=Debug -DCOMPOST_BUILD_TESTS=ON
      - name: Build native core
        run: cmake --build native/build-ci --parallel
      - name: Run native tests
        run: ctest --test-dir native/build-ci --output-on-failure
